[project]
name = "samvedna"
version = "0.1.0"
description = "Predictive personnel stress and welfare monitoring for uniformed forces — the model argues, the arithmetic decides"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "numpy>=1.26",
    # Used by `db/store.py`. The same schema runs on SQLite for a portable
    # demonstration and on PostgreSQL in a data centre.
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    # Zscaler-style TLS interception breaks certifi-based clients on this
    # network. truststore routes verification through the OS trust store.
    "truststore>=0.10",
]

[project.scripts]
samvedna = "samvedna.cli:main"

[project.optional-dependencies]
# Tabular risk model and per-person attribution. Phase 5.
# scikit-learn rather than LightGBM: LightGBM's wheels link against libomp,
# which is a Homebrew install on macOS and absent on a clean machine. A project
# that has to survive being copied onto a pendrive cannot depend on that.
# Gradient boosting from scikit-learn is the same algorithm family, ships
# self-contained, and is fully supported by SHAP's TreeExplainer.
ml = ["scikit-learn>=1.5", "shap>=0.46", "numpy>=1.26"]
# Optional accelerated backend, and the deck's declared tabular model.
# `tools/train_tabular.py --backend auto` (the default) prefers LightGBM when
# it *loads* and falls back to scikit-learn when it does not.
#
# "Loads", not "imports", and the distinction is the reason for the fallback:
# the wheel installs cleanly and then dies at load with
#   dlopen(lib_lightgbm.dylib): Library not loaded: @rpath/libomp.dylib
# because libomp is a separate Homebrew package (macOS) or libgomp1 (Debian).
# That is an OSError, not an ImportError. A project that must survive being
# copied onto a pendrive cannot make its risk model depend on it.
fast = ["lightgbm>=4.5"]
# Sequence + survival models. Phase 13.
#
# Also not imported. `models/sequence.py` and `models/survival.py` use a
# discrete-time hazard model on the same scikit-learn stack, with explicit
# roster-rhythm features in place of a Temporal Transformer. torch is ~2 GB and
# cannot be emailed; the seam is a Protocol so a torch-backed sequence model
# substitutes without changing a caller.
deep = ["torch>=2.4"]

# Encryption at rest. Required by `db/store.py`, which refuses to open rather
# than storing identities in the clear when this is missing — there is no
# plaintext fallback, deliberately. Prebuilt wheels on macOS, Linux and
# Windows, so no compiler is needed.
secure = ["cryptography>=43.0"]
# Federated training and DP-SGD — the deck's declared privacy stack, and the
# production target.
#
# `analytics/models/federated.py` does NOT import these. It implements FedAvg
# with clip-then-noise ordering and a finite epsilon budget directly, in numpy,
# because both Flower and Opacus pull torch and a recipient of an emailed
# archive cannot be required to acquire a working torch build first. The
# aggregation seam is a Protocol, so a Flower-backed strategy substitutes
# without touching the callers. Installing this extra makes the production
# stack available; it does not change which code path runs.
federated = ["flwr>=1.12", "opacus>=1.5"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/samvedna"]

[tool.uv]
package = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: trains a model or generates a large cohort",
]

[tool.ruff]
line-length = 96
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "RET", "C4"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
"src/samvedna/api/*" = ["B008"]
"tools/*" = ["E501"]
